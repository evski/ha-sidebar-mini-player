# Monthly, grouped: one PR per ecosystem instead of one per package (12 Oct 2026, Grok Bot)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # jsdom 25+ needs Node 22; CI still tests Node 20
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
