name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Test and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check the tag matches VERSION in the file
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(grep -oP 'const VERSION = "\K[^"]+' ha-sidebar-mini-player.js)
          echo "tag=$TAG file=$FILE_VERSION"
          test "$TAG" = "$FILE_VERSION"

      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[[^]]+\]: / {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "See CHANGELOG.md" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release with the JS attached
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ha-sidebar-mini-player.js
          fail_on_unmatched_files: true
